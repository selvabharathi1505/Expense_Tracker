<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div id="auth-section">
        <h1>Expense Tracker</h1>

        <h2>Register</h2>
        <form id="register-form">
            <label for="register-username">Username:</label>
            <input type="text" id="register-username" minlength="3" maxlength="50" required>

            <br><br>

            <label for="register-email">Email:</label>
            <input type="email" id="register-email" required>

            <br><br>

            <label for="register-password">Password:</label>
            <input type="password" id="register-password" minlength="8" maxlength="128" required>

            <br><br>

            <button type="submit">Register</button>
        </form>

        <hr>

        <h2>Login</h2>
        <form id="login-form">
            <label for="login-username">Username:</label>
            <input type="text" id="login-username" required>

            <br><br>

            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required>

            <br><br>

            <button type="submit">Login</button>
        </form>

        <p id="auth-message" role="status"></p>
    </div>

    <div id="expense-section" hidden>
        <h1>Expense Tracker</h1>
        
        <div id="error-container" hidden>
        <p id="error-message">
            Unable to connect to the server. Please check your connection and try again.
        </p>
        <button id="retry-button" type="button">Retry</button>
    </div>

        <h2>My Expenses</h2>

        
    <section id="summary">
        <h2>Spending Summary</h2>

        <h3>Total Spending: ₹<span id="total-spending">0</span></h3>

        <h3>Category-wise Spending</h3>
        <ul id="category-summary"></ul>
    </section>


        <table class="expense-table">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id ="expense-list">

            </tbody>

        </table>

        <h2>Add Expense</h2>

        <form id="expense-form">

            <label for="name">Expense Name:</label>
            <input type="text" id="name" name="expense_name" required>

            <br><br>

            <label for="category">Category:</label>
            <input type="text" id="category" name="expense_category" required>

            <br><br>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="expense_amount" min="1" required>

            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="expense_date" required>

            <br><br>

            <button class="add-button" type="submit">Add Expense</button>

        </form>
    </div>
    
    <script src="./script.js"></script>

</body>
</html>
