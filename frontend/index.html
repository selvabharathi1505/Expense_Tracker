    <!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>

<body>

    <h1>Expense Tracker</h1>

    <h2>My Expenses</h2>

    <table border="4">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Lunch</td>
                <td>Food</td>
                <td>₹200</td>
                <td>2026-10-06</td>
                <td>
                    <button>Edit</button>
                    <button>Delete</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Bus</td>
                <td>Travel</td>
                <td>₹50</td>
                <td>2026-10-06</td>
                <td>
                    <button>Edit</button>
                    <button>Delete</button>
                </td>
            </tr>

        </tbody>

    </table>

    <h2>Add Expense</h2>

<form>

    <label for="name">Expense Name:</label>
    <input type="text" id="name" name="expense_name" required>

    <br><br>

    <label for="category">Category:</label>
    <input type="text" id="category" name="expense_category" required>

    <br><br>

    <label for="amount">Amount:</label>
    <input type="number" id="amount" name="expense_amount" min="1" required>

    <br><br>

    <label for="date">Date:</label>
    <input type="date" id="date" name="expense_date" required>

    <br><br>

    <button type="submit">Add Expense</button>

</form>

</body>
</html>
